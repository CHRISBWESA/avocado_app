<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Avocado AI">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <title>Avocado Intelligence</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">AI Powered</div>
      <h1>Avocado Intelligence</h1>
      <p class="subtitle">Check if your avocado is ripe and ready to eat</p>
    </div>

    <div class="preview-container" id="previewContainer">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">🥑</div>
        <div class="placeholder-text">No image selected</div>
        <div class="placeholder-hint">Capture or upload a photo to begin</div>
      </div>
      <img class="preview" id="preview" style="display:none" alt="Preview">
    </div>

    <div class="button-row">
      <button class="button camera-button" id="cameraBtn">
        <span class="button-icon">📷</span> Camera
      </button>
      <button class="button gallery-button" id="galleryBtn">
        <span class="button-icon">🖼️</span> Gallery
      </button>
    </div>

    <div class="status-box" id="statusBox" style="display:none">
      <div class="spinner"></div>
      <span class="status-text" id="statusText">Analyzing avocado...</span>
    </div>

    <div class="result-box" id="resultBox" style="display:none"></div>

    <div class="footer">Avocado Intelligence PWA</div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
